name: Add RPM to existing release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (for example v0.4.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  rpm:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Install packaging tools
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          echo 'https://mirrors.edge.kernel.org/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          sudo apt-get -o APT::Update::Error-Mode=any update
          sudo apt-get install -y --no-install-recommends rpm desktop-file-utils
      - name: Download and verify released runtime
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release download "$RELEASE_TAG" --pattern weebshot-x86_64.AppImage --dir dist
          digest="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.assets[] | select(.name == "weebshot-x86_64.AppImage") | .digest')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "${digest#sha256:}  dist/weebshot-x86_64.AppImage" | sha256sum --check
      - name: Package RPM
        run: bash scripts/package-rpm.sh dist/weebshot-x86_64.AppImage "${RELEASE_TAG#v}"
      - name: Test install and removal on Fedora
        run: |
          docker run --rm -v "$PWD:/work:ro" registry.fedoraproject.org/fedora:45 \
            bash /work/scripts/test-rpm.sh /work/dist/weebshot-x86_64.rpm
      - uses: actions/upload-artifact@v7
        with:
          name: rpm
          path: dist/weebshot-x86_64.rpm
      - name: Attach verified RPM to release
        run: gh release upload "$RELEASE_TAG" dist/weebshot-x86_64.rpm
