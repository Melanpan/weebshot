name: Release

# Push a tag like `v0.2.0` (matching the version in Cargo.toml) to build all platforms and
# publish a GitHub Release with the downloads attached.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate release version and notes
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re, tomllib
          version = tomllib.loads(pathlib.Path('Cargo.toml').read_text())['package']['version']
          assert re.fullmatch(r'\d+\.\d+\.\d+', version), 'Expected a stable release version'
          tag = os.environ['RELEASE_TAG']
          assert not tag or tag == f'v{version}', f'Tag {tag} does not match Cargo version {version}'
          lock = tomllib.loads(pathlib.Path('Cargo.lock').read_text())
          assert next(p['version'] for p in lock['package'] if p['name'] == 'weebshot') == version
          changelog = pathlib.Path('CHANGELOG.md').read_text()
          section = re.search(rf'^## {re.escape(version)} — \d{{4}}-\d{{2}}-\d{{2}}\n(.*?)(?=^## |\Z)', changelog, re.M | re.S)
          assert section and re.search(r'^- ', section[1], re.M), f'Missing release notes for {version}'
          print(f'Release metadata verified: {version}')
          PY

  windows:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Fetch libmpv
        run: ./scripts/fetch-libmpv.ps1
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build and package (with ffmpeg + gifsicle)
        run: ./scripts/package.ps1
      - name: Test with bundled media tools
        run: |
          $env:PATH = "$PWD\dist\weebshot;$env:PATH"
          cargo test --locked
      - name: Test Anime4K with the packaged helper
        run: |
          $env:PATH = "$PWD\dist\weebshot;$env:PATH"
          cargo test --locked export::anime4k::tests -- --ignored
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/weebshot-windows-x64.zip

  linux:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install libraries and tools
        run: |
          # The man-db trigger can stall apt for most of an hour on GitHub's Ubuntu images.
          sudo rm -f /var/lib/man-db/auto-update
          # Avoid the hosted image's Ubuntu DNS failures; APT still verifies Ubuntu signatures.
          printf '%s\n' 'https://mirror.math.princeton.edu/pub/ubuntu/' 'https://mirrors.edge.kernel.org/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          sudo apt-get -o Acquire::Retries=3 -o Acquire::ForceIPv4=true -o APT::Update::Error-Mode=any update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::ForceIPv4=true install -y --no-install-recommends libmpv-dev ffmpeg gifsicle libxkbcommon-dev libxkbcommon-x11-0 libgl1-mesa-dev \
            libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev file \
            libavformat-dev libavcodec-dev libavutil-dev ocl-icd-opencl-dev opencl-clhpp-headers \
            rpm desktop-file-utils
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - name: Build AppImage
        run: bash scripts/package-linux.sh
      - name: Test Anime4K with the staged helper
        run: cargo test --locked export::anime4k::tests -- --ignored
      - name: Package Fedora RPM
        run: bash scripts/package-rpm.sh
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            dist/weebshot-x86_64.AppImage
            dist/weebshot-x86_64.rpm

  fedora-rpm:
    needs: linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: linux
          path: dist
      - name: Test RPM installation and runtime on Fedora
        run: |
          docker run --rm -v "$PWD:/work:ro" registry.fedoraproject.org/fedora:45 \
            bash /work/scripts/test-rpm.sh /work/dist/weebshot-x86_64.rpm

  macos:
    needs: validate
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Install libraries and tools
        run: brew install mpv ffmpeg gifsicle dylibbundler pkgconf cmake
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test with Homebrew libraries
        run: LIBRARY_PATH="$(brew --prefix)/lib${LIBRARY_PATH:+:$LIBRARY_PATH}" cargo test
      - name: Build app
        run: bash scripts/package-macos.sh
      - name: Test Anime4K with the staged helper
        run: PATH="$PWD/dist/weebshot.app/Contents/MacOS:$PATH" LIBRARY_PATH="$(brew --prefix)/lib${LIBRARY_PATH:+:$LIBRARY_PATH}" cargo test --locked export::anime4k::tests -- --ignored
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/weebshot-macos-arm64.zip

  release:
    needs: [windows, linux, macos, fedora-rpm]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          # The "## <version> — <date>" section for this tag, without its heading.
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## / { p = ($2 == v) ; next } p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See [CHANGELOG.md](CHANGELOG.md)." > notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: notes.md
