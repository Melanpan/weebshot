name: Release

# Push a tag like `v0.2.0` (matching the version in Cargo.toml) to build all platforms and
# publish a GitHub Release with the downloads attached.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch libmpv
        run: ./scripts/fetch-libmpv.ps1
      - name: Build and package (with ffmpeg + gifsicle)
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/weebshot-windows-x64.zip

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install libraries and tools
        run: |
          # The man-db trigger can stall apt for most of an hour on GitHub's Ubuntu images.
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmpv-dev ffmpeg gifsicle libxkbcommon-dev libgl1-mesa-dev \
            libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev file
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build AppImage
        run: bash scripts/package-linux.sh
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/weebshot-x86_64.AppImage

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Install libraries and tools
        run: brew install mpv gifsicle dylibbundler
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build app
        run: bash scripts/package-macos.sh
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/weebshot-macos-arm64.zip

  release:
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
